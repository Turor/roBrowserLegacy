<div id="StylingShop" data-background="styleshop/bg_styling.bmp">
	<div class="titlebar">
		<span class="title" data-text="2813"></span>
		<button class="close" title="Close"></button>
	</div>

	<div class="tabs">
		<button class="tab hair" data-tab="hair" data-image="tab_hair"></button>
		<button class="tab accessory" data-tab="accessory" data-image="tab_accessories"></button>
		<button class="tab costume disabled" data-background="styleshop/tab_2ndcostume_disable.bmp"></button>
	</div>

	<div class="preview">
		<div class="frame" data-background="styleshop/bg_slot.bmp">
			<canvas class="character" width="109" height="137"></canvas>
		</div>
		<div class="rotate">
			<button
				class="rotate-left"
				data-background="styleshop/btn_rotatearrow_l_out.bmp"
				data-hover="styleshop/btn_rotatearrow_l_over.bmp"
				data-down="styleshop/btn_rotatearrow_l_press.bmp"
			></button>
			<button
				class="rotate-right"
				data-background="styleshop/btn_rotatearrow_r_out.bmp"
				data-hover="styleshop/btn_rotatearrow_r_over.bmp"
				data-down="styleshop/btn_rotatearrow_r_press.bmp"
			></button>
		</div>
		<div class="hint" data-text="2835"></div>
	</div>

	<div class="options"></div>

	<div class="footer">
		<div class="cost">
			<span class="zeny-icon" data-background="styleshop/icon_zeny.bmp"></span>
			<span class="total">0</span>
			<span class="coupons"></span>
		</div>
		<button
			class="reset"
			title="Reset"
			data-background="styleshop/btn_refresh_out.bmp"
			data-hover="styleshop/btn_refresh_over.bmp"
			data-down="styleshop/btn_refresh_press.bmp"
		></button>
		<button class="buy-disabled" data-background="styleshop/btn_buy_disable.bmp"></button>
		<button
			class="buy"
			data-background="styleshop/btn_buy_out.bmp"
			data-hover="styleshop/btn_buy_over.bmp"
			data-down="styleshop/btn_buy_press.bmp"
		></button>
	</div>
</div>
