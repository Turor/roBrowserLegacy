name: 'Generate multiple releases'

concurrency:
    group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

on:
    push:
        branches: ['master']
        tags:
            - 'v*'
    schedule:
        - cron: '0 2 * * *'

permissions:
    security-events: write
    contents: write

jobs:
    build:
        name: 'Builds the package'
        runs-on: [self-hosted, elastic, cores-2, mem-4096]
        steps:
            - name: guest packages
              run: |
                  # Alpine robrowser-ci golden bakes rsync/zip/Node 24; Debian guests still use apt.
                  if command -v rsync >/dev/null && command -v zip >/dev/null; then
                    echo "rsync/zip already present"
                  elif command -v apk >/dev/null; then
                    sudo apk add --no-cache rsync zip
                  elif command -v apt-get >/dev/null; then
                    sudo apt-get update -qq && sudo apt-get install -y -qq rsync zip
                  else
                    echo "No package manager and rsync/zip missing" >&2
                    exit 1
                  fi

            - name: 'Checkout the repository'
              uses: actions/checkout@v5
              with:
                  ref: 'master'

            # setup-node@v6 downloads glibc Node; Alpine musl golden already has Node 24 at /usr/local/bin.
            - name: 'Verify NodeJS version'
              run: |
                  node -v
                  npm -v
                  node -e "const m=+process.versions.node.split('.')[0]; if (m < 22) { console.error('need node>=22'); process.exit(1) }"

            - name: 'Generate a package-lock.json file'
              run: npm install --package-lock-only

            - name: 'Install dependencies'
              run: npm ci

            - name: 'Compile the project'
              run: npm run build

            - name: 'Create npm package tarball'
              run: |
                  npm pack --silent --pack-destination "${{ github.workspace }}"

            - name: 'Compact the dist/Web directory contents'
              run: |
                  test -d dist/Web
                  cd dist/Web
                  zip -r "${{ github.workspace }}/release-dist-web.zip" .

            - name: 'Create release'
              uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b
              if: github.ref_type == 'tag' && github.event_name == 'push'
              with:
                  prerelease: false
                  tag_name: ${{ github.ref_name }}
                  files: |
                      *.tgz
                      release-dist-web.zip
                  generate_release_notes: true

            - name: 'Create nightly release'
              uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b
              if: github.event_name == 'schedule'
              with:
                  prerelease: true
                  tag_name: nightly
                  files: |
                      *.tgz
                      release-dist-web.zip

